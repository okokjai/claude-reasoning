<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1380" width="100%" height="100%" style="background:#111113; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .anno { font-size: 13px; fill: #a1a1aa; }
      .anno-head { font-size: 15px; font-weight: 700; fill: #f4f4f5; }
      .anno-dim { font-size: 13px; fill: #a1a1aa; }
      .anno-cmd { font-size: 12.5px; fill: #d4d4d8; }
      .hdr-label { font-size: 12px; font-weight: 700; fill: #8b8b93; text-transform: uppercase; letter-spacing: 0.1em; }
      .ttl { font-size: 17px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
      .body { font-size: 13.5px; fill: #d4d4d8; }
      .sub { font-size: 12.5px; fill: #a1a1aa; }
      .micro { font-size: 12px; fill: #71717a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3f3f46"/>
    </marker>
  </defs>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(44, 40)">
    <text x="0" y="24" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">CLAUDE-REASONING</text>
    <text x="296" y="22" class="sub">· claim-gated adaptive reasoning architecture</text>
  </g>

  <!-- Divider between editorial column and system diagram -->
  <line x1="244" y1="108" x2="244" y2="920" stroke="#1f1f23" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: EDITORIAL ANNOTATIONS ================= -->
  <text x="44" y="118" class="hdr-label">operator notes</text>

  <!-- Block 1: start -->
  <g transform="translate(44, 138)">
    <g>
      <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="10" y="22" font-size="15" font-weight="800" fill="#f4f4f5">1</text>
    </g>
    <text x="44" y="14" class="anno-head">start</text>
    <text x="44" y="34" class="anno-dim">fresh state · clock stamped</text>
    <text x="44" y="60" class="mono anno-cmd">think.ts --reset</text>
    <text x="44" y="80" class="mono anno-cmd">think.ts --status</text>
  </g>

  <!-- Block 2: declare -->
  <g transform="translate(44, 256)">
    <g>
      <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="10" y="22" font-size="15" font-weight="800" fill="#f4f4f5">2</text>
    </g>
    <text x="44" y="14" class="anno-head">declare</text>
    <text x="44" y="34" class="anno-dim">first thought locks the mode</text>
    <text x="44" y="60" class="mono anno-cmd">--mode path-a | path-b</text>
    <text x="44" y="80" class="mono anno-cmd">--kind decision</text>
  </g>

  <!-- Block 3: run -->
  <g transform="translate(44, 374)">
    <g>
      <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="10" y="22" font-size="15" font-weight="800" fill="#f4f4f5">3</text>
    </g>
    <text x="44" y="14" class="anno-head">run</text>
    <text x="44" y="34" class="anno-dim">thoughts · hypotheses · lenses</text>
    <text x="44" y="60" class="mono anno-cmd">--thought …</text>
    <text x="44" y="80" class="mono anno-cmd">--registerHypothesis …</text>
    <text x="44" y="100" class="mono anno-cmd">--recordLens --lens …</text>
  </g>

  <!-- Block 4: converge -->
  <g transform="translate(44, 510)">
    <g>
      <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="10" y="22" font-size="15" font-weight="800" fill="#f4f4f5">4</text>
    </g>
    <text x="44" y="14" class="anno-head">converge</text>
    <text x="44" y="34" class="anno-dim">declare: no new insight</text>
    <text x="44" y="60" class="mono anno-cmd">--resolveHypothesis …</text>
    <text x="44" y="80" class="mono anno-cmd">--nextThoughtNeeded false</text>
  </g>

  <!-- Block 5: export -->
  <g transform="translate(44, 634)">
    <g>
      <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="10" y="22" font-size="15" font-weight="800" fill="#f4f4f5">5</text>
    </g>
    <text x="44" y="14" class="anno-head">export</text>
    <text x="44" y="34" class="anno-dim">fact sheet printed once</text>
    <text x="44" y="60" class="mono anno-cmd">think.ts --export</text>
    <text x="44" y="80" class="anno-dim">paste verbatim into report</text>
  </g>

  <!-- Editorial guard note -->
  <g transform="translate(44, 748)">
    <rect width="226" height="72" rx="8" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <text x="16" y="30" class="anno-head" fill="#f87171">any guard violation</text>
    <text x="16" y="54" class="mono anno-cmd" fill="#ef4444">exit 1 · --reset to restart</text>
  </g>

  <g transform="translate(44, 850)">
    <text x="0" y="0" class="anno-dim">never trust — verify first.</text>
    <text x="0" y="20" class="anno-dim">depth is earned by insight,</text>
    <text x="0" y="40" class="anno-dim">never by padding.</text>
    <text x="0" y="68" class="mono micro">scripts/.think_state.json</text>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM DIAGRAM ================= -->

  <!-- Root node: state machine (centered title) -->
  <g transform="translate(274, 130)">
    <rect width="642" height="76" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(321, 32)">
      <circle cx="-186" cy="-6" r="4" fill="#22c55e"/>
      <text x="-174" y="-1" class="mono micro">on call</text>
      <text x="0" y="0" text-anchor="middle" class="ttl">think.ts · State Machine</text>
      <text x="0" y="26" text-anchor="middle" class="sub">plans structure + enforces invariants · exit 1 hard stops</text>
      <text x="164" y="-1" class="mono micro">zero MCP</text>
    </g>
  </g>

  <!-- Split connector: root -> path-a / path-b -->
  <line x1="595" y1="206" x2="595" y2="230" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 437 230 L 753 230" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
  <line x1="437" y1="230" x2="437" y2="254" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="753" y1="230" x2="753" y2="254" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ PATH A CARD (left half) ============ -->
  <g transform="translate(274, 258)">
    <rect width="314" height="326" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 24)">
      <!-- header row -->
      <rect width="60" height="22" rx="5" fill="#2a1f0f" stroke="#78350f"/>
      <text x="12" y="15" class="mono" font-size="11.5" font-weight="700" fill="#f59e0b">path-a</text>
      <text x="70" y="16" class="ttl" font-size="16">closed-form</text>
      <text x="254" y="16" class="mono micro">3–5</text>

      <text x="0" y="48" class="anno">Prove a single correct answer.</text>

      <!-- capability rows -->
      <g transform="translate(0, 68)">
        <text x="0" y="0" class="hdr-label">pipeline</text>
        <text x="0" y="20" class="body">restate → derive → cross-validate</text>
      </g>
      <g transform="translate(0, 112)">
        <text x="0" y="0" class="hdr-label">depth bound</text>
        <text x="0" y="20" class="body">3–5 thoughts, enforced in code</text>
      </g>
      <g transform="translate(0, 156)">
        <text x="0" y="0" class="hdr-label">forbidden</text>
        <text x="0" y="20" font-size="13.5" fill="#f87171">claims · hypotheses · external search</text>
      </g>
      <g transform="translate(0, 200)">
        <text x="0" y="0" class="hdr-label">guard</text>
        <text x="0" y="20" font-size="13.5" fill="#e4e4e7">depth &lt;3 or &gt;5 → exit 1</text>
      </g>

      <!-- running indicator -->
      <g transform="translate(0, 250)">
        <circle cx="4" cy="4" r="3" fill="#f59e0b"/>
        <text x="14" y="8" class="mono" font-size="11.5" fill="#f59e0b">deterministic proof</text>
        <text x="160" y="8" class="mono" font-size="11.5" fill="#71717a">never by padding</text>
      </g>
    </g>
  </g>

  <!-- ============ PATH B CARD (right half) ============ -->
  <g transform="translate(602, 258)">
    <rect width="314" height="326" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 24)">
      <rect width="60" height="22" rx="5" fill="#0f2033" stroke="#1e40af"/>
      <text x="12" y="15" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8">path-b</text>
      <text x="70" y="16" class="ttl" font-size="16">open-ended</text>
      <text x="252" y="16" class="mono micro">≥2</text>

      <text x="0" y="48" class="anno">Converge on a defensible choice.</text>

      <g transform="translate(0, 68)">
        <text x="0" y="0" class="hdr-label">hypotheses</text>
        <text x="0" y="20" class="body">≥2 registered + falsification clause</text>
        <text x="0" y="40" class="mono micro">resolved: survived: / falsified:</text>
      </g>
      <g transform="translate(0, 124)">
        <text x="0" y="0" class="hdr-label">critical lenses</text>
        <text x="0" y="20" class="body">11-lens catalog, 2–4 per task</text>
        <text x="0" y="40" class="mono" font-size="12" fill="#c084fc">--analyze sensitivity · pareto · ach</text>
      </g>
      <g transform="translate(0, 180)">
        <text x="0" y="0" class="hdr-label">external verify</text>
        <text x="0" y="20" font-size="13.5" fill="#38bdf8">≥2 Tier 1/2 sources, claim-gated</text>
      </g>

      <g transform="translate(0, 250)">
        <circle cx="4" cy="4" r="3" fill="#22c55e"/>
        <text x="14" y="8" class="mono" font-size="11.5" fill="#22c55e">evidence-first convergence</text>
        <text x="206" y="8" class="mono" font-size="11.5" fill="#71717a">never by scoring</text>
      </g>
    </g>
  </g>

  <!-- Converge connector into Terminal Gates -->
  <line x1="595" y1="584" x2="595" y2="608" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Terminal Gates bar -->
  <g transform="translate(274, 612)">
    <rect width="642" height="76" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 22)">
      <text x="0" y="16" class="ttl" font-size="16">Terminal Gates 6–11</text>
      <text x="210" y="16" class="mono micro">auto_review checks approvals</text>
      <text x="0" y="44" class="anno">criteria · lenses · falsification · convergence</text>
      <g transform="translate(506, 6)">
        <rect width="114" height="32" rx="6" fill="#1f1416" stroke="#450a0a"/>
        <text x="15" y="21" class="mono" font-size="12.5" font-weight="700" fill="#ef4444">fail → exit 1</text>
      </g>
    </g>
  </g>

  <!-- ================= STATE TRACE ================= -->
  <text x="274" y="726" class="hdr-label">session trace</text>
  <g transform="translate(274, 742)">
    <rect width="642" height="216" rx="12" fill="#0c0c0e" stroke="#1c1c20" stroke-width="1.2"/>

    <!-- Titlebar (traffic lights, like the original) -->
    <g transform="translate(20, 18)">
      <circle cx="4" cy="4" r="4" fill="#ef4444"/>
      <circle cx="18" cy="4" r="4" fill="#f59e0b"/>
      <circle cx="32" cy="4" r="4" fill="#22c55e"/>
      <text x="48" y="8" class="mono micro">session log</text>
      <text x="506" y="8" class="mono" font-size="11.5" fill="#52525b">.think_state.json</text>
    </g>

    <g transform="translate(20, 40)" class="mono" font-size="12.5">
      <g>
        <rect width="602" height="36" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="23" fill="#52525b">23:48:17</text>
        <text x="84" y="23" font-weight="700" fill="#a1a1aa">step 0</text>
        <text x="144" y="23" fill="#e4e4e7">topology → open-ended</text>
        <text x="378" y="23" fill="#38bdf8">mode=path-b</text>
        <text x="520" y="23" fill="#22c55e">locked</text>
      </g>
      <g transform="translate(0, 42)">
        <rect width="602" height="36" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="23" fill="#52525b">23:48:18</text>
        <text x="84" y="23" font-weight="700" fill="#a1a1aa">analyze</text>
        <text x="144" y="23" fill="#e4e4e7">sensitivity flip ±20%</text>
        <text x="378" y="23" fill="#c084fc">rank stable</text>
        <text x="520" y="23" fill="#22c55e">persisted</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="602" height="36" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="23" fill="#52525b">23:48:19</text>
        <text x="84" y="23" font-weight="700" fill="#a1a1aa">verify</text>
        <text x="144" y="23" fill="#e4e4e7">aws.amazon.com + anthropic</text>
        <text x="378" y="23" fill="#38bdf8">2x Tier 1</text>
        <text x="520" y="23" fill="#22c55e">verified</text>
      </g>
      <g transform="translate(0, 126)">
        <rect width="602" height="36" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="23" fill="#52525b">23:48:20</text>
        <text x="84" y="23" font-weight="700" fill="#a1a1aa">gates</text>
        <text x="144" y="23" fill="#e4e4e7">Gates 6–11 verified</text>
        <text x="378" y="23" fill="#a1a1aa">blockers=0</text>
        <text x="520" y="23" fill="#22c55e" font-weight="700">export trace</text>
      </g>
    </g>
  </g>

  <!-- ================= 11-LENS CATALOG (BELOW DIAGRAM) ================= -->
  <line x1="44" y1="996" x2="916" y2="996" stroke="#1f1f23" stroke-width="1"/>
  <text x="44" y="1024" class="hdr-label" font-size="13">critical lenses menu · 11-lens catalog</text>
  <text x="44" y="1050" class="anno-dim">path-b only · pick 2–4 lenses that attack this problem's key failure mode — never enable all. computed lenses run deterministically via --analyze.</text>

  <!-- Column headers -->
  <text x="44" y="1084" class="hdr-label" font-size="12.5" fill="#8b8b93">red-team &amp; dialectic</text>
  <text x="336" y="1084" class="hdr-label" font-size="12.5" fill="#8b8b93">systemic &amp; boundary</text>
  <text x="628" y="1084" class="hdr-label" font-size="12.5" fill="#8b8b93">operational &amp; governance</text>

  <!-- Column 1: Core Red-Team & Dialectic Lenses -->
  <g transform="translate(44, 1104)" class="mono" font-size="12">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-1</text><text x="54" y="0" fill="#a1a1aa">first-principles</text>
      <text x="54" y="20" fill="#71717a">strip assumptions to irreducible constraints</text>
    </g>
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#f4f4f5">lens-2</text><text x="54" y="0" fill="#a1a1aa">pre-mortem</text>
      <text x="54" y="20" fill="#71717a">assume it failed — what killed it?</text>
    </g>
    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#f4f4f5">lens-3</text><text x="54" y="0" fill="#a1a1aa">contrarian</text>
      <text x="54" y="20" fill="#71717a">defend the worst-ranked option</text>
    </g>
    <g transform="translate(0, 126)">
      <text x="0" y="0" fill="#f4f4f5">lens-4</text><text x="54" y="0" fill="#a1a1aa">reversal</text>
      <text x="54" y="20" fill="#71717a">invert the load-bearing assumption</text>
    </g>
  </g>

  <!-- Column 2: Systemic, Scale & Boundary Lenses -->
  <g transform="translate(336, 1104)" class="mono" font-size="12">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-5</text><text x="54" y="0" fill="#a1a1aa">scale-stress</text>
      <text x="54" y="20" fill="#71717a">hold at 100× / 0.01×? first cliff?</text>
    </g>
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#f4f4f5">lens-6</text><text x="54" y="0" fill="#c084fc">sensitivity ⟨computed⟩</text>
      <text x="54" y="20" fill="#71717a">±20% jitter — does ranking flip?</text>
    </g>
    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#f4f4f5">lens-7</text><text x="54" y="0" fill="#c084fc">pareto ⟨computed⟩</text>
      <text x="54" y="20" fill="#71717a">what is traded away?</text>
    </g>
    <g transform="translate(0, 126)">
      <text x="0" y="0" fill="#f4f4f5">lens-8</text><text x="54" y="0" fill="#c084fc">ach ⟨computed⟩</text>
      <text x="54" y="20" fill="#71717a">eliminate hypotheses by evidence</text>
    </g>
  </g>

  <!-- Column 3: Operational & Governance Lenses -->
  <g transform="translate(628, 1104)" class="mono" font-size="12">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-9</text><text x="54" y="0" fill="#a1a1aa">second-order</text>
      <text x="54" y="20" fill="#71717a">incentives &amp; workaround behavior</text>
    </g>
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#f4f4f5">lens-10</text><text x="54" y="0" fill="#a1a1aa">reversibility</text>
      <text x="54" y="20" fill="#71717a">one-way door? run experiment first</text>
    </g>
    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#f4f4f5">lens-11</text><text x="54" y="0" fill="#a1a1aa">blast-radius</text>
      <text x="54" y="20" fill="#71717a">fail safe / silent / cascade?</text>
    </g>
  </g>

  <!-- Kind → lens pairing footer -->
  <line x1="44" y1="1272" x2="916" y2="1272" stroke="#1f1f23" stroke-width="1"/>
  <text x="44" y="1298" class="hdr-label" font-size="12.5" fill="#8b8b93">auto pairing · --kind selects core lenses first</text>
  <text x="44" y="1324" class="mono" font-size="12" fill="#c9c9cf">diagnostic <tspan fill="#71717a">→ 8·1 (opt 5·11)</tspan>   |   decision <tspan fill="#71717a">→ 6·10·3 (opt 2·9)</tspan>   |   design <tspan fill="#71717a">→ 7·5·11 (opt 2·10)</tspan></text>
  <text x="44" y="1348" class="mono" font-size="12" fill="#c9c9cf">optimization <tspan fill="#71717a">→ 7·6·5 (opt 1)</tspan>   |   innovation <tspan fill="#71717a">→ 1·4·3 (opt 2)</tspan>   |   planning <tspan fill="#71717a">→ 9·2·10 (opt 3)</tspan></text>
</svg>
