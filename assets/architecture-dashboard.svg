<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1330" width="100%" height="100%" style="background:#111113; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', Consolas, Monaco, Menlo, monospace; }
      .anno { font-size: 11.5px; fill: #a1a1aa; }
      .anno-head { font-size: 12.5px; font-weight: 700; fill: #e4e4e7; }
      .anno-dim { font-size: 11px; fill: #71717a; }
      .anno-cmd { font-size: 11px; fill: #d4d4d8; }
      .hdr-label { font-size: 10px; font-weight: 600; fill: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
      .ttl { font-size: 14.5px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3f3f46"/>
    </marker>
  </defs>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(44, 40)">
    <text x="0" y="24" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">CLAUDE-REASONING</text>
    <rect x="272" y="7" width="54" height="22" rx="6" fill="#27272a"/>
    <text x="281" y="22" class="mono" font-size="11" font-weight="700" fill="#a1a1aa">v3.2.1</text>
    <text x="338" y="22" font-size="12" fill="#71717a">· claim-gated adaptive reasoning architecture</text>
  </g>

  <!-- Divider between editorial column and system diagram -->
  <line x1="244" y1="108" x2="244" y2="944" stroke="#1f1f23" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: EDITORIAL ANNOTATIONS ================= -->
  <text x="44" y="118" class="hdr-label">operator notes</text>

  <!-- Block 1: start -->
  <g transform="translate(44, 140)">
    <g>
      <rect width="30" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="9" y="21" font-size="14" font-weight="800" fill="#f4f4f5">1</text>
    </g>
    <text x="42" y="13" class="anno-head">start</text>
    <text x="42" y="29" class="anno-dim">fresh state · clock stamped</text>
    <text x="42" y="56" class="mono anno-cmd">think.ts --reset</text>
    <text x="42" y="74" class="mono anno-cmd">think.ts --status</text>
  </g>

  <!-- Block 2: declare -->
  <g transform="translate(44, 250)">
    <g>
      <rect width="30" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="9" y="21" font-size="14" font-weight="800" fill="#f4f4f5">2</text>
    </g>
    <text x="42" y="13" class="anno-head">declare</text>
    <text x="42" y="29" class="anno-dim">first thought locks the mode</text>
    <text x="42" y="56" class="mono anno-cmd">--mode path-a | path-b</text>
    <text x="42" y="74" class="mono anno-cmd">--kind decision</text>
  </g>

  <!-- Block 3: run -->
  <g transform="translate(44, 360)">
    <g>
      <rect width="30" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="9" y="21" font-size="14" font-weight="800" fill="#f4f4f5">3</text>
    </g>
    <text x="42" y="13" class="anno-head">run</text>
    <text x="42" y="29" class="anno-dim">thoughts · hypotheses · lenses</text>
    <text x="42" y="56" class="mono anno-cmd">--thought …</text>
    <text x="42" y="74" class="mono anno-cmd">--registerHypothesis …</text>
    <text x="42" y="92" class="mono anno-cmd">--recordLens --lens …</text>
  </g>

  <!-- Block 4: converge -->
  <g transform="translate(44, 500)">
    <g>
      <rect width="30" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="9" y="21" font-size="14" font-weight="800" fill="#f4f4f5">4</text>
    </g>
    <text x="42" y="13" class="anno-head">converge</text>
    <text x="42" y="29" class="anno-dim">declare: no new insight</text>
    <text x="42" y="56" class="mono anno-cmd">--resolveHypothesis …</text>
    <text x="42" y="74" class="mono anno-cmd">--nextThoughtNeeded false</text>
  </g>

  <!-- Block 5: export -->
  <g transform="translate(44, 610)">
    <g>
      <rect width="30" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="9" y="21" font-size="14" font-weight="800" fill="#f4f4f5">5</text>
    </g>
    <text x="42" y="13" class="anno-head">export</text>
    <text x="42" y="29" class="anno-dim">fact sheet printed once</text>
    <text x="42" y="56" class="mono anno-cmd">think.ts --export</text>
    <text x="42" y="74" class="anno-dim">paste verbatim into report</text>
  </g>

  <!-- Editorial guard note -->
  <g transform="translate(44, 730)">
    <rect width="212" height="64" rx="8" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <text x="14" y="24" class="anno-head" fill="#f87171">any guard violation</text>
    <text x="14" y="44" class="mono anno-cmd" fill="#ef4444">exit 1 · --reset to restart</text>
  </g>

  <g transform="translate(44, 820)">
    <text x="0" y="0" class="anno-dim">never trust — verify first.</text>
    <text x="0" y="18" class="anno-dim">depth is earned by insight,</text>
    <text x="0" y="36" class="anno-dim">never by padding.</text>
    <text x="0" y="60" class="mono" font-size="10.5" fill="#3f3f46">scripts/.think_state.json</text>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM DIAGRAM ================= -->

  <!-- Root node: state machine (centered title) -->
  <g transform="translate(274, 130)">
    <rect width="642" height="76" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(321, 30)">
      <circle cx="-176" cy="-5" r="4" fill="#22c55e"/>
      <text x="-164" y="-1" class="mono" font-size="10.5" fill="#71717a">on call</text>
      <text x="0" y="0" text-anchor="middle" class="ttl">think.ts · State Machine</text>
      <text x="0" y="24" text-anchor="middle" font-size="12" fill="#a1a1aa">plans structure + enforces invariants · exit 1 hard stops</text>
      <text x="160" y="-1" class="mono" font-size="10.5" fill="#71717a">zero MCP</text>
    </g>
  </g>

  <!-- Split connector: root -> path-a / path-b -->
  <line x1="595" y1="206" x2="595" y2="230" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 437 230 L 753 230" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
  <line x1="437" y1="230" x2="437" y2="254" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="753" y1="230" x2="753" y2="254" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ PATH A CARD (left half) ============ -->
  <g transform="translate(274, 258)">
    <rect width="314" height="326" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 22)">
      <!-- header row -->
      <rect width="54" height="20" rx="5" fill="#2a1f0f" stroke="#78350f"/>
      <text x="11" y="14" class="mono" font-size="10" font-weight="700" fill="#f59e0b">path-a</text>
      <text x="64" y="15" class="ttl" font-size="13.5">closed-form</text>
      <text x="240" y="15" class="mono" font-size="10.5" fill="#71717a">3–5</text>

      <text x="0" y="44" font-size="11.5" fill="#a1a1aa">Prove a single correct answer.</text>

      <!-- capability rows -->
      <g transform="translate(0, 62)">
        <text x="0" y="0" class="hdr-label">pipeline</text>
        <text x="0" y="18" font-size="12" fill="#e4e4e7">restate → derive → cross-validate</text>
      </g>
      <g transform="translate(0, 104)">
        <text x="0" y="0" class="hdr-label">depth bound</text>
        <text x="0" y="18" font-size="12" fill="#e4e4e7">3–5 thoughts, enforced in code</text>
      </g>
      <g transform="translate(0, 146)">
        <text x="0" y="0" class="hdr-label">forbidden</text>
        <text x="0" y="18" font-size="11.5" fill="#f87171">claims · hypotheses · external search</text>
      </g>
      <g transform="translate(0, 188)">
        <text x="0" y="0" class="hdr-label">guard</text>
        <text x="0" y="18" font-size="11.5" fill="#e4e4e7">depth &lt;3 or &gt;5 → exit 1</text>
      </g>

      <!-- running indicator -->
      <g transform="translate(0, 236)">
        <circle cx="4" cy="4" r="3" fill="#f59e0b"/>
        <text x="14" y="8" class="mono" font-size="10" fill="#f59e0b">deterministic proof</text>
        <text x="150" y="8" class="mono" font-size="10" fill="#71717a">never by padding</text>
      </g>
    </g>
  </g>

  <!-- ============ PATH B CARD (right half) ============ -->
  <g transform="translate(602, 258)">
    <rect width="314" height="326" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 22)">
      <rect width="54" height="20" rx="5" fill="#0f2033" stroke="#1e40af"/>
      <text x="11" y="14" class="mono" font-size="10" font-weight="700" fill="#38bdf8">path-b</text>
      <text x="64" y="15" class="ttl" font-size="13.5">open-ended</text>
      <text x="238" y="15" class="mono" font-size="10.5" fill="#71717a">≥2</text>

      <text x="0" y="44" font-size="11.5" fill="#a1a1aa">Converge on a defensible choice.</text>

      <g transform="translate(0, 62)">
        <text x="0" y="0" class="hdr-label">hypotheses</text>
        <text x="0" y="18" font-size="12" fill="#e4e4e7">≥2 registered + falsification clause</text>
        <text x="0" y="36" font-size="11" fill="#71717a">resolved: survived: / falsified:</text>
      </g>
      <g transform="translate(0, 118)">
        <text x="0" y="0" class="hdr-label">critical lenses</text>
        <text x="0" y="18" font-size="12" fill="#e4e4e7">11-lens catalog, 2–4 per task</text>
        <text x="0" y="36" font-size="11" fill="#c084fc">--analyze sensitivity · pareto · ach</text>
      </g>
      <g transform="translate(0, 174)">
        <text x="0" y="0" class="hdr-label">external verify</text>
        <text x="0" y="18" font-size="11.5" fill="#38bdf8">≥2 Tier 1/2 sources, claim-gated</text>
      </g>

      <g transform="translate(0, 236)">
        <circle cx="4" cy="4" r="3" fill="#22c55e"/>
        <text x="14" y="8" class="mono" font-size="10" fill="#22c55e">evidence-first convergence</text>
        <text x="196" y="8" class="mono" font-size="10" fill="#71717a">never by scoring</text>
      </g>
    </g>
  </g>

  <!-- Converge connector into Terminal Gates -->
  <line x1="595" y1="584" x2="595" y2="608" stroke="#3f3f46" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Terminal Gates bar -->
  <g transform="translate(274, 612)">
    <rect width="642" height="76" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.2"/>
    <g transform="translate(20, 20)">
      <text x="0" y="14" class="ttl" font-size="13.5">Terminal Gates 6–11</text>
      <text x="186" y="14" class="mono" font-size="10.5" fill="#71717a">auto_review checks approvals</text>
      <text x="0" y="40" font-size="11.5" fill="#a1a1aa">criteria · lenses · falsification · convergence</text>
      <g transform="translate(506, 8)">
        <rect width="110" height="28" rx="6" fill="#1f1416" stroke="#450a0a"/>
        <text x="14" y="18" class="mono" font-size="11" font-weight="700" fill="#ef4444">fail → exit 1</text>
      </g>
    </g>
  </g>

  <!-- ================= STATE TRACE ================= -->
  <text x="274" y="726" class="hdr-label">session trace</text>
  <g transform="translate(274, 742)">
    <rect width="642" height="216" rx="12" fill="#0c0c0e" stroke="#1c1c20" stroke-width="1.2"/>

    <!-- Titlebar (traffic lights, like the original) -->
    <g transform="translate(20, 18)">
      <circle cx="4" cy="4" r="3.5" fill="#ef4444"/>
      <circle cx="17" cy="4" r="3.5" fill="#f59e0b"/>
      <circle cx="30" cy="4" r="3.5" fill="#22c55e"/>
      <text x="46" y="8" class="mono" font-size="10.5" fill="#71717a">session log</text>
      <text x="520" y="8" class="mono" font-size="10" fill="#3f3f46">.think_state.json</text>
    </g>

    <g transform="translate(20, 40)" class="mono" font-size="11">
      <g>
        <rect width="602" height="34" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="22" fill="#52525b">23:48:17</text>
        <text x="76" y="22" font-weight="700" fill="#a1a1aa">step 0</text>
        <text x="130" y="22" fill="#e4e4e7">topology → open-ended</text>
        <text x="356" y="22" fill="#38bdf8">mode=path-b</text>
        <text x="498" y="22" fill="#22c55e">locked</text>
      </g>
      <g transform="translate(0, 40)">
        <rect width="602" height="34" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="22" fill="#52525b">23:48:18</text>
        <text x="76" y="22" font-weight="700" fill="#a1a1aa">analyze</text>
        <text x="130" y="22" fill="#e4e4e7">sensitivity flip ±20%</text>
        <text x="356" y="22" fill="#c084fc">rank stable</text>
        <text x="498" y="22" fill="#22c55e">persisted</text>
      </g>
      <g transform="translate(0, 80)">
        <rect width="602" height="34" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="22" fill="#52525b">23:48:19</text>
        <text x="76" y="22" font-weight="700" fill="#a1a1aa">verify</text>
        <text x="130" y="22" fill="#e4e4e7">aws.amazon.com + anthropic</text>
        <text x="356" y="22" fill="#38bdf8">2x Tier 1</text>
        <text x="498" y="22" fill="#22c55e">verified</text>
      </g>
      <g transform="translate(0, 120)">
        <rect width="602" height="34" rx="5" fill="#111114" stroke="#19191d"/>
        <text x="12" y="22" fill="#52525b">23:48:20</text>
        <text x="76" y="22" font-weight="700" fill="#a1a1aa">gates</text>
        <text x="130" y="22" fill="#e4e4e7">Gates 6–11 verified</text>
        <text x="356" y="22" fill="#a1a1aa">blockers=0</text>
        <text x="498" y="22" fill="#22c55e" font-weight="700">export trace</text>
      </g>
    </g>
  </g>

  <!-- ================= 11-LENS CATALOG (BELOW DIAGRAM) ================= -->
  <line x1="44" y1="996" x2="916" y2="996" stroke="#1f1f23" stroke-width="1"/>
  <text x="44" y="1022" class="hdr-label">critical lenses menu · 11-lens catalog</text>
  <text x="44" y="1042" class="anno-dim">path-b only · pick 2–4 lenses that attack this problem's key failure mode — never enable all. computed lenses run deterministically via --analyze.</text>

  <!-- Column headers -->
  <text x="44" y="1072" class="hdr-label" fill="#3f3f46">red-team &amp; dialectic</text>
  <text x="336" y="1072" class="hdr-label" fill="#3f3f46">systemic &amp; boundary</text>
  <text x="628" y="1072" class="hdr-label" fill="#3f3f46">operational &amp; governance</text>

  <!-- Column 1: Core Red-Team & Dialectic Lenses -->
  <g transform="translate(44, 1090)" class="mono" font-size="10.5">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-1</text><text x="46" y="0" fill="#a1a1aa">first-principles</text>
      <text x="46" y="16" fill="#52525b">strip assumptions to irreducible constraints</text>
    </g>
    <g transform="translate(0, 34)">
      <text x="0" y="0" fill="#f4f4f5">lens-2</text><text x="46" y="0" fill="#a1a1aa">pre-mortem</text>
      <text x="46" y="16" fill="#52525b">assume it failed — what killed it?</text>
    </g>
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#f4f4f5">lens-3</text><text x="46" y="0" fill="#a1a1aa">contrarian</text>
      <text x="46" y="16" fill="#52525b">defend the worst-ranked option</text>
    </g>
    <g transform="translate(0, 102)">
      <text x="0" y="0" fill="#f4f4f5">lens-4</text><text x="46" y="0" fill="#a1a1aa">reversal</text>
      <text x="46" y="16" fill="#52525b">invert the load-bearing assumption</text>
    </g>
  </g>

  <!-- Column 2: Systemic, Scale & Boundary Lenses -->
  <g transform="translate(336, 1090)" class="mono" font-size="10.5">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-5</text><text x="46" y="0" fill="#a1a1aa">scale-stress</text>
      <text x="46" y="16" fill="#52525b">hold at 100× / 0.01×? first cliff?</text>
    </g>
    <g transform="translate(0, 34)">
      <text x="0" y="0" fill="#f4f4f5">lens-6</text><text x="46" y="0" fill="#c084fc">sensitivity ⟨computed⟩</text>
      <text x="46" y="16" fill="#52525b">±20% jitter — does ranking flip?</text>
    </g>
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#f4f4f5">lens-7</text><text x="46" y="0" fill="#c084fc">pareto ⟨computed⟩</text>
      <text x="46" y="16" fill="#52525b">what is traded away?</text>
    </g>
    <g transform="translate(0, 102)">
      <text x="0" y="0" fill="#f4f4f5">lens-8</text><text x="46" y="0" fill="#c084fc">ach ⟨computed⟩</text>
      <text x="46" y="16" fill="#52525b">eliminate hypotheses by evidence</text>
    </g>
  </g>

  <!-- Column 3: Operational & Governance Lenses -->
  <g transform="translate(628, 1090)" class="mono" font-size="10.5">
    <g>
      <text x="0" y="0" fill="#f4f4f5">lens-9</text><text x="46" y="0" fill="#a1a1aa">second-order</text>
      <text x="46" y="16" fill="#52525b">incentives &amp; workaround behavior</text>
    </g>
    <g transform="translate(0, 34)">
      <text x="0" y="0" fill="#f4f4f5">lens-10</text><text x="46" y="0" fill="#a1a1aa">reversibility</text>
      <text x="46" y="16" fill="#52525b">one-way door? run experiment first</text>
    </g>
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#f4f4f5">lens-11</text><text x="46" y="0" fill="#a1a1aa">blast-radius</text>
      <text x="46" y="16" fill="#52525b">fail safe / silent / cascade?</text>
    </g>
  </g>

  <!-- Kind → lens pairing footer -->
  <line x1="44" y1="1244" x2="916" y2="1244" stroke="#1f1f23" stroke-width="1"/>
  <text x="44" y="1268" class="hdr-label" fill="#3f3f46">auto pairing · --kind selects core lenses first</text>
  <text x="44" y="1292" class="mono" font-size="10.5" fill="#a1a1aa">diagnostic <tspan fill="#52525b">→ 8·1 (opt 5·11)</tspan>   |   decision <tspan fill="#52525b">→ 6·10·3 (opt 2·9)</tspan>   |   design <tspan fill="#52525b">→ 7·5·11 (opt 2·10)</tspan></text>
  <text x="44" y="1310" class="mono" font-size="10.5" fill="#a1a1aa">optimization <tspan fill="#52525b">→ 7·6·5 (opt 1)</tspan>   |   innovation <tspan fill="#52525b">→ 1·4·3 (opt 2)</tspan>   |   planning <tspan fill="#52525b">→ 9·2·10 (opt 3)</tspan></text>
</svg>
