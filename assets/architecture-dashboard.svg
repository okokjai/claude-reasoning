<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1160" width="100%" height="100%" style="background:#121214; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', Consolas, Monaco, 'Liberation Mono', Menlo, monospace; }
      .title { font-weight: 800; letter-spacing: -0.03em; }
      .label { font-weight: 500; font-size: 11px; fill: #71717a; }
      .val { font-weight: 600; font-size: 13px; fill: #f4f4f5; }
      .pill-text { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Card Frame (Matte Charcoal with Subtle Hairline Border) -->
  <rect x="16" y="16" width="888" height="1128" rx="20" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>

  <!-- ================= 1. HEADER: ARCHITECT & RUNTIME ================= -->
  <g transform="translate(44, 46)">
    <!-- Brand Title -->
    <text x="0" y="32" class="title" font-size="34" fill="#ffffff" letter-spacing="-0.04em">CLAUDE-REASONING</text>
    <text x="0" y="52" font-size="12" fill="#71717a">v3.2.0 · adaptive reasoning &amp; claim-gated verification</text>

    <!-- Top-Right Architect Pill Card -->
    <g transform="translate(470, -2)">
      <rect width="362" height="66" rx="12" fill="#202024" stroke="#2e2e33" stroke-width="1"/>
      
      <!-- Top row inside pill -->
      <circle cx="18" cy="22" r="4.5" fill="#22c55e"/>
      <text x="30" y="26" font-size="13" font-weight="700" fill="#f4f4f5">think.ts · state machine</text>
      <rect x="238" y="12" width="56" height="20" rx="6" fill="#27272a"/>
      <text x="246" y="26" class="pill-text" fill="#a1a1aa">on call</text>
      <rect x="300" y="12" width="50" height="20" rx="6" fill="#3f3f46" fill-opacity="0.4"/>
      <text x="307" y="26" class="pill-text" fill="#e4e4e7">v3 live</text>

      <!-- Bottom row inside pill -->
      <text x="18" y="48" font-size="11" fill="#a1a1aa">enforces invariants &amp; gates · exit 1 hard stops</text>
      <text x="282" y="48" class="mono" font-size="10.5" fill="#71717a">zero MCP</text>
    </g>

    <!-- Sub-callout below title -->
    <g transform="translate(0, 72)">
      <text x="0" y="16" font-size="11.5" fill="#a1a1aa">spawned on each thought round, executes deterministic checks, gates convergence</text>
    </g>
  </g>

  <!-- ================= 2. STEP 0: FORK LAYER (JEV STYLE) ================= -->
  <g transform="translate(44, 156)">
    <rect width="832" height="178" rx="14" fill="#141416" stroke="#27272a" stroke-width="1.2"/>
    
    <!-- Header of Fork Layer -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="13" font-weight="700" fill="#f4f4f5">STEP 0 · fork layer</text>
      <text x="0" y="32" font-size="11" fill="#71717a">immutable question topology classification</text>

      <!-- Metric Stat Box: Invariants & Catalog -->
      <g transform="translate(260, -4)">
        <text x="0" y="14" class="label">total invariants</text>
        <text x="0" y="36" class="title" font-size="22" fill="#ffffff">333</text>
        <text x="46" y="36" font-size="12" font-weight="600" fill="#22c55e">pass</text>
      </g>

      <g transform="translate(410, -4)">
        <text x="0" y="14" class="label">critical lenses</text>
        <text x="0" y="36" class="title" font-size="22" fill="#ffffff">11</text>
        <text x="28" y="36" font-size="12" font-weight="600" fill="#a1a1aa">catalog</text>
      </g>
    </g>

    <!-- Fork Decisions (3 Chips identical to ASTRA's which file / which tool / retry or stop) -->
    <g transform="translate(20, 74)">
      <!-- Decision Chip 1: Path A -->
      <g transform="translate(0, 0)">
        <rect width="254" height="74" rx="10" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="1"/>
        <text x="14" y="24" font-size="12" font-weight="600" fill="#e4e4e7">closed-form logic</text>
        <rect x="156" y="11" width="86" height="20" rx="6" fill="#27272a"/>
        <text x="164" y="25" class="mono" font-size="10.5" font-weight="600" fill="#f59e0b">path-a</text>
        
        <text x="14" y="46" class="label">depth: 3–5 thoughts</text>
        <text x="14" y="61" class="mono" font-size="10" fill="#71717a">no claims · no search</text>
      </g>

      <!-- Decision Chip 2: Path B -->
      <g transform="translate(268, 0)">
        <rect width="260" height="74" rx="10" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="1"/>
        <text x="14" y="24" font-size="12" font-weight="600" fill="#e4e4e7">open-ended strategy</text>
        <rect x="162" y="11" width="86" height="20" rx="6" fill="#27272a"/>
        <text x="170" y="25" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">path-b</text>

        <text x="14" y="46" class="label">hypotheses + lenses</text>
        <text x="14" y="61" class="mono" font-size="10" fill="#71717a">falsification clause req.</text>
      </g>

      <!-- Decision Chip 3: Violation / Exit 1 Guard -->
      <g transform="translate(542, 0)">
        <rect width="250" height="74" rx="10" fill="#1f181a" stroke="#3b1d24" stroke-width="1"/>
        <text x="14" y="24" font-size="12" font-weight="600" fill="#fca5a5">illegal transition</text>
        <rect x="162" y="11" width="76" height="20" rx="6" fill="#450a0a"/>
        <text x="170" y="25" class="mono" font-size="10.5" font-weight="700" fill="#f87171">exit 1</text>

        <text x="14" y="46" class="label" fill="#f87171">mode mutate / pad</text>
        <text x="14" y="61" class="mono" font-size="10" fill="#f87171">hard stop in code</text>
      </g>
    </g>

    <!-- Bottom rule note -->
    <text x="24" y="165" class="mono" font-size="10.5" fill="#a1a1aa">valid mode → runs in state machine <tspan fill="#52525b">|</tspan> violation → hard exit 1</text>
  </g>

  <!-- ================= 3. SPAWN ENGINES: 3 VERTICAL CARDS (ASTRA AGENT GRID) ================= -->
  <g transform="translate(44, 350)">
    <!-- Sub-header bar -->
    <rect width="832" height="34" rx="8" fill="#141416" stroke="#242427" stroke-width="1"/>
    <text x="16" y="22" font-size="11.5" font-weight="600" fill="#e4e4e7">active reasoning engines</text>
    <text x="200" y="22" class="mono" font-size="10.5" fill="#71717a">zero pseudo-quant scoring · evidence-first</text>
    <text x="680" y="22" class="mono" font-size="10.5" fill="#a1a1aa">effort: adaptive</text>

    <!-- The 3 Side-by-Side Cards (worker / explorer / researcher in ASTRA) -->
    <g transform="translate(0, 46)">
      <!-- CARD 1: Hypothesis Engine -->
      <g transform="translate(0, 0)">
        <rect width="268" height="264" rx="14" fill="#141416" stroke="#27272a" stroke-width="1.2"/>
        
        <g transform="translate(18, 20)">
          <text x="0" y="14" font-size="14" font-weight="700" fill="#ffffff">hypothesis engine</text>
          <text x="0" y="32" class="mono" font-size="11" fill="#71717a">--registerHypothesis</text>

          <rect x="0" y="46" width="232" height="1" fill="#242427"/>

          <!-- Body details -->
          <text x="0" y="66" class="label">PREREQUISITE</text>
          <text x="0" y="82" font-size="12" font-weight="500" fill="#e4e4e7">≥2 competing registered</text>
          <text x="0" y="98" class="mono" font-size="10.5" fill="#38bdf8">--falsification &lt;clause&gt;</text>

          <text x="0" y="126" class="label">RESOLUTION AUDIT</text>
          <text x="0" y="142" class="mono" font-size="11" fill="#a1a1aa">survived: / falsified:</text>
          <text x="0" y="158" class="mono" font-size="11" fill="#a1a1aa">merged into target</text>
          
          <text x="0" y="184" class="label">BOUNDARY REVERSAL</text>
          <text x="0" y="200" class="mono" font-size="10.5" fill="#f59e0b">--flipIf &lt;condition&gt;</text>

          <!-- Status badge at bottom -->
          <g transform="translate(0, 212)">
            <circle cx="6" cy="10" r="3.5" fill="#22c55e"/>
            <text x="16" y="14" class="mono" font-size="10.5" font-weight="600" fill="#22c55e">falsification bound</text>
          </g>
        </g>
      </g>

      <!-- CARD 2: 11-Lens Catalog & Deterministic Compute -->
      <g transform="translate(282, 0)">
        <rect width="268" height="264" rx="14" fill="#141416" stroke="#27272a" stroke-width="1.2"/>
        
        <g transform="translate(18, 20)">
          <text x="0" y="14" font-size="14" font-weight="700" fill="#ffffff">11-lens catalog</text>
          <text x="0" y="32" class="mono" font-size="11" fill="#71717a">--listLenses / --recordLens</text>

          <rect x="0" y="46" width="232" height="1" fill="#242427"/>

          <text x="0" y="66" class="label">QUALITATIVE LENSES</text>
          <text x="0" y="82" font-size="12" font-weight="500" fill="#e4e4e7">First Principles · Contrarian</text>
          <text x="0" y="98" font-size="12" font-weight="500" fill="#e4e4e7">Pre-Mortem · Blast Radius</text>

          <text x="0" y="126" class="label">COMPUTED ENGINE (--analyze)</text>
          <text x="0" y="142" class="mono" font-size="11" fill="#c084fc">sensitivity (±20% flip)</text>
          <text x="0" y="158" class="mono" font-size="11" fill="#c084fc">pareto (frontier rank)</text>
          <text x="0" y="174" class="mono" font-size="11" fill="#c084fc">ach (inconsistency matrix)</text>

          <!-- Status badge at bottom -->
          <g transform="translate(0, 212)">
            <circle cx="6" cy="10" r="3.5" fill="#22c55e"/>
            <text x="16" y="14" class="mono" font-size="10.5" font-weight="600" fill="#22c55e">deterministic TS</text>
          </g>
        </g>
      </g>

      <!-- CARD 3: External Claim Verification Module -->
      <g transform="translate(564, 0)">
        <rect width="268" height="264" rx="14" fill="#141416" stroke="#27272a" stroke-width="1.2"/>
        
        <g transform="translate(18, 20)">
          <text x="0" y="14" font-size="14" font-weight="700" fill="#ffffff">claim verification</text>
          <text x="0" y="32" class="mono" font-size="11" fill="#71717a">--registerClaim / --verifyClaim</text>

          <rect x="0" y="46" width="232" height="1" fill="#242427"/>

          <text x="0" y="66" class="label">CORROBORATION RULE</text>
          <text x="0" y="82" font-size="12" font-weight="500" fill="#e4e4e7">≥2 root domains (IP-safe)</text>
          <text x="0" y="98" font-size="11" font-weight="600" fill="#38bdf8">Tier 1 &amp; Tier 2 sources only</text>

          <text x="0" y="126" class="label">COUNTER-EVIDENCE PROBE</text>
          <text x="0" y="142" class="mono" font-size="10.5" fill="#a1a1aa">--claimQuote verbatim</text>
          <text x="0" y="158" class="mono" font-size="10.5" fill="#a1a1aa">--negativeFinding required</text>
          
          <text x="0" y="184" class="label">TEMPORAL FRESHNESS</text>
          <text x="0" y="200" class="mono" font-size="10.5" fill="#f59e0b">&lt;180 days pub date audit</text>

          <!-- Status badge at bottom -->
          <g transform="translate(0, 212)">
            <circle cx="6" cy="10" r="3.5" fill="#22c55e"/>
            <text x="16" y="14" class="mono" font-size="10.5" font-weight="600" fill="#22c55e">anti-hallucination</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Note under the 3 cards (identical to ASTRA's "never writes code itself. Sol applies the review") -->
    <text x="4" y="326" font-size="11.5" fill="#71717a">Never trusts ungrounded claims. Hypotheses must survive falsification before conclusion.</text>
  </g>

  <!-- ================= 4. REVIEW & VERIFY GATE (ASTRA "before done" BAR) ================= -->
  <g transform="translate(44, 712)">
    <rect width="832" height="66" rx="12" fill="#141416" stroke="#2e2e33" stroke-width="1.2"/>
    
    <g transform="translate(20, 16)">
      <!-- Label "before done" pill -->
      <rect x="0" y="4" width="86" height="26" rx="6" fill="#27272a"/>
      <text x="10" y="21" class="mono" font-size="11" font-weight="700" fill="#f4f4f5">before done</text>

      <text x="102" y="22" font-size="13" font-weight="700" fill="#ffffff">Terminal Gates 6–11 · automated audit &amp; convergence check</text>

      <!-- Right badge -->
      <g transform="translate(640, 2)">
        <rect width="152" height="30" rx="8" fill="#1f181a" stroke="#450a0a"/>
        <text x="12" y="19" class="mono" font-size="10.5" font-weight="700" fill="#f87171">unmet → exit 1</text>
      </g>
    </g>
  </g>

  <!-- ================= 5. SESSION LOG: THE SIGNATURE REAL-TIME FEED ================= -->
  <g transform="translate(44, 796)">
    <rect width="832" height="306" rx="14" fill="#0d0d0f" stroke="#222226" stroke-width="1.2"/>
    
    <!-- Titlebar of Session Log -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.05em">SESSION LOG</text>
      <text x="100" y="14" class="mono" font-size="11" fill="#71717a">real-time state transitions recorded by think.ts</text>
    </g>

    <!-- The 5 Micro-feed rows (Exact typography & layout of ASTRA's timestamped log) -->
    <g transform="translate(20, 52)" class="mono" font-size="11.5">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="792" height="42" rx="8" fill="#131316" stroke="#1c1c20" stroke-width="1"/>
        <text x="14" y="25" fill="#71717a">08:14:20</text>
        <text x="86" y="25" font-weight="700" fill="#a1a1aa">router</text>
        <text x="156" y="25" fill="#f4f4f5">question topology → open-ended</text>
        <rect x="580" y="10" width="94" height="22" rx="6" fill="#18181b" stroke="#27272a"/>
        <text x="590" y="25" font-size="10.5" fill="#38bdf8">mode locked</text>
        <text x="692" y="25" fill="#22c55e" font-weight="600">path-b</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <rect width="792" height="42" rx="8" fill="#131316" stroke="#1c1c20" stroke-width="1"/>
        <text x="14" y="25" fill="#71717a">08:14:22</text>
        <text x="86" y="25" font-weight="700" fill="#a1a1aa">hypo</text>
        <text x="156" y="25" fill="#f4f4f5">registered hyp-1, hyp-2</text>
        <rect x="580" y="10" width="124" height="22" rx="6" fill="#18181b" stroke="#27272a"/>
        <text x="590" y="25" font-size="10.5" fill="#f59e0b">falsification set</text>
        <text x="720" y="25" fill="#a1a1aa">&gt;=2 req</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 96)">
        <rect width="792" height="42" rx="8" fill="#131316" stroke="#1c1c20" stroke-width="1"/>
        <text x="14" y="25" fill="#71717a">08:14:24</text>
        <text x="86" y="25" font-weight="700" fill="#a1a1aa">compute</text>
        <text x="156" y="25" fill="#f4f4f5">--analyze sensitivity --data '&lt;json&gt;'</text>
        <rect x="580" y="10" width="104" height="22" rx="6" fill="#18181b" stroke="#27272a"/>
        <text x="590" y="25" font-size="10.5" fill="#c084fc">rank-flip ±20%</text>
        <text x="700" y="25" fill="#22c55e" font-weight="600">persisted</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 144)">
        <rect width="792" height="42" rx="8" fill="#131316" stroke="#1c1c20" stroke-width="1"/>
        <text x="14" y="25" fill="#71717a">08:14:26</text>
        <text x="86" y="25" font-weight="700" fill="#a1a1aa">verify</text>
        <text x="156" y="25" fill="#f4f4f5">claim-1 verified (aws.amazon.com, anthropic.com)</text>
        <rect x="580" y="10" width="94" height="22" rx="6" fill="#18181b" stroke="#27272a"/>
        <text x="590" y="25" font-size="10.5" fill="#38bdf8">2x Tier 1</text>
        <text x="692" y="25" fill="#22c55e" font-weight="600">42d old</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 192)">
        <rect width="792" height="42" rx="8" fill="#131316" stroke="#1c1c20" stroke-width="1"/>
        <text x="14" y="25" fill="#71717a">08:14:28</text>
        <text x="86" y="25" font-weight="700" fill="#a1a1aa">terminal</text>
        <text x="156" y="25" fill="#f4f4f5">gates 6-11 passed · newInsight=false</text>
        <rect x="580" y="10" width="94" height="22" rx="6" fill="#18181b" stroke="#27272a"/>
        <text x="590" y="25" font-size="10.5" fill="#22c55e">converged</text>
        <text x="692" y="25" fill="#22c55e" font-weight="700">trace ok</text>
      </g>
    </g>
  </g>
</svg>
