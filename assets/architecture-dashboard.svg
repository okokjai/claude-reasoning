<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ================= TOP STATUS BAR ================= -->
  <g transform="translate(30, 24)">
    <rect width="1140" height="72" rx="14" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Title & Badge -->
    <text x="24" y="36" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">CLAUDE-REASONING</text>
    <rect x="235" y="20" width="56" height="22" rx="6" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1"/>
    <text x="246" y="35" fill="#60a5fa" font-size="11" font-weight="700">v3.2.0</text>
    
    <text x="24" y="55" fill="#94a3b8" font-size="12">Deterministic State Machine &amp; Claim-Gated External Verification · Zero MCP</text>
    
    <!-- Status Badges on Right -->
    <g transform="translate(730, 20)">
      <!-- Badge 1: Mode Switch -->
      <rect x="0" y="0" width="118" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="14" cy="16" r="4.5" fill="#10b981"/>
      <text x="26" y="20" fill="#cbd5e1" font-size="11" font-weight="600">STATE: v3 LIVE</text>

      <!-- Badge 2: Invariants -->
      <rect x="128" y="0" width="138" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="142" cy="16" r="4.5" fill="#38bdf8"/>
      <text x="154" y="20" fill="#cbd5e1" font-size="11" font-weight="600">INVARIANTS: EXIT 1</text>

      <!-- Badge 3: Tests -->
      <rect x="276" y="0" width="124" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="290" cy="16" r="4.5" fill="#a855f7"/>
      <text x="302" y="20" fill="#cbd5e1" font-size="11" font-weight="600">14 SUITES PASS</text>
    </g>
  </g>

  <!-- ================= STEP 0 ROUTER ================= -->
  <g transform="translate(30, 112)">
    <rect width="1140" height="64" rx="12" fill="#0d1527" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#cardShadow)"/>
    <circle cx="30" cy="32" r="10" fill="#1e3a8a"/>
    <text x="26" y="36" fill="#60a5fa" font-size="12" font-weight="700">0</text>
    
    <text x="52" y="28" fill="#f1f5f9" font-size="14" font-weight="700">STEP 0: Structural Question Classifier</text>
    <text x="52" y="48" fill="#94a3b8" font-size="11">Required on Thought 1 · Immutable thereafter · Routes by problem topology, never keyword matching</text>

    <!-- Branch Tags -->
    <rect x="740" y="16" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="752" y="36" fill="#f59e0b" font-size="11" font-weight="700">PATH A → Closed-Form</text>

    <rect x="932" y="16" width="188" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="944" y="36" fill="#38bdf8" font-size="11" font-weight="700">PATH B → Open-Ended Loop</text>
  </g>

  <!-- ================= PATH A COLUMN (Left) ================= -->
  <g transform="translate(30, 192)">
    <rect width="360" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Path A Header -->
    <rect x="16" y="16" width="328" height="42" rx="8" fill="#1e293b"/>
    <text x="32" y="42" fill="#fbbf24" font-size="14" font-weight="700">PATH A: Closed-Form Pipeline</text>
    <text x="240" y="42" fill="#94a3b8" font-size="11" font-weight="600">Depth: 3–5</text>

    <!-- Flow items -->
    <g transform="translate(20, 74)">
      <!-- Item 1 -->
      <rect width="320" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="20" cy="26" r="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="17" y="30" fill="#fbbf24" font-size="10" font-weight="700">1</text>
      <text x="36" y="24" fill="#e2e8f0" font-size="12" font-weight="600">Restate &amp; Surface Definitions</text>
      <text x="36" y="40" fill="#64748b" font-size="10">Expose hidden constraints &amp; axioms</text>

      <!-- Arrow -->
      <path d="M 160 55 L 160 67" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Item 2 -->
      <rect y="70" width="320" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="20" cy="96" r="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="17" y="100" fill="#fbbf24" font-size="10" font-weight="700">2</text>
      <text x="36" y="94" fill="#e2e8f0" font-size="12" font-weight="600">Primary Formal Derivation</text>
      <text x="36" y="110" fill="#64748b" font-size="10">Closed step-by-step logic proof</text>

      <!-- Arrow -->
      <path d="M 160 125 L 160 137" stroke="#475569" stroke-width="2"/>

      <!-- Item 3 -->
      <rect y="140" width="320" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="20" cy="166" r="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="17" y="170" fill="#fbbf24" font-size="10" font-weight="700">3</text>
      <text x="36" y="164" fill="#e2e8f0" font-size="12" font-weight="600">Independent Cross-Validation</text>
      <text x="36" y="180" fill="#64748b" font-size="10">Verification via distinct alternative angle</text>
    </g>

    <!-- Path A Guard Card -->
    <g transform="translate(20, 290)">
      <rect width="320" height="106" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1.2"/>
      <text x="16" y="24" fill="#f59e0b" font-size="11" font-weight="700">STRICT INVARIANTS (GUARDRAILS)</text>
      
      <circle cx="22" cy="46" r="3" fill="#ef4444"/>
      <text x="32" y="50" fill="#cbd5e1" font-size="11">Depth &lt; 3 or Depth &gt; 5 → <tspan fill="#f87171" font-weight="700">Exit 1</tspan></text>
      
      <circle cx="22" cy="68" r="3" fill="#ef4444"/>
      <text x="32" y="72" fill="#cbd5e1" font-size="11">Claims / Hypotheses forbidden → <tspan fill="#f87171" font-weight="700">Exit 1</tspan></text>

      <circle cx="22" cy="90" r="3" fill="#ef4444"/>
      <text x="32" y="94" fill="#cbd5e1" font-size="11">External search or padding → <tspan fill="#f87171" font-weight="700">Exit 1</tspan></text>
    </g>

    <!-- Outcome Tag -->
    <rect x="20" y="412" width="320" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
    <text x="60" y="438" fill="#a7f3d0" font-size="12" font-weight="700">✓ Direct Formal Proof Delivered</text>
  </g>

  <!-- ================= PATH B COLUMN (Right Main Area) ================= -->
  <g transform="translate(410, 192)">
    <rect width="760" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Path B Header -->
    <rect x="18" y="16" width="724" height="42" rx="8" fill="#1e293b"/>
    <text x="36" y="42" fill="#38bdf8" font-size="14" font-weight="700">PATH B: Open-Ended Convergence &amp; Verification Loop</text>
    <text x="560" y="42" fill="#94a3b8" font-size="11" font-weight="600">Adaptive Depth · Proof-Gated</text>

    <!-- Sub-Block 1: Hypothesis Engine -->
    <g transform="translate(20, 72)">
      <rect width="350" height="150" rx="10" fill="#0b1322" stroke="#1d4ed8" stroke-width="1"/>
      <text x="16" y="24" fill="#60a5fa" font-size="12" font-weight="700">1. Hypothesis &amp; Falsification Engine</text>
      
      <rect x="16" y="36" width="318" height="46" rx="6" fill="#111c33"/>
      <text x="26" y="53" fill="#e2e8f0" font-size="11">Register ≥2 competing hypotheses</text>
      <text x="26" y="69" fill="#93c5fd" font-size="10" font-family="monospace">--falsification &lt;clause&gt; (Mandatory)</text>

      <rect x="16" y="88" width="318" height="48" rx="6" fill="#111c33"/>
      <text x="26" y="105" fill="#cbd5e1" font-size="10">Resolution Audit: <tspan fill="#34d399">survived:</tspan> | <tspan fill="#f87171">falsified:</tspan> | <tspan fill="#fbbf24">merged</tspan></text>
      <text x="26" y="122" fill="#94a3b8" font-size="10">Survivors require <tspan fill="#93c5fd" font-family="monospace">--flipIf</tspan> boundary condition</text>
    </g>

    <!-- Sub-Block 2: Lenses & Compute -->
    <g transform="translate(390, 72)">
      <rect width="350" height="150" rx="10" fill="#0b1322" stroke="#7c3aed" stroke-width="1"/>
      <text x="16" y="24" fill="#c084fc" font-size="12" font-weight="700">2. 11-Lens Catalog &amp; Computation</text>

      <rect x="16" y="36" width="318" height="46" rx="6" fill="#1a1333"/>
      <text x="26" y="53" fill="#e2e8f0" font-size="11">Qualitative Lenses (--recordLens)</text>
      <text x="26" y="69" fill="#d8b4fe" font-size="10">First Principles, Pre-Mortem, Red Team...</text>

      <rect x="16" y="88" width="318" height="48" rx="6" fill="#1a1333"/>
      <text x="26" y="105" fill="#e2e8f0" font-size="11">Deterministic Engine (--analyze &lt;kind&gt;)</text>
      <text x="26" y="122" fill="#c084fc" font-size="10" font-family="monospace">sensitivity · pareto · ach (Pure TypeScript)</text>
    </g>

    <!-- Sub-Block 3: External Claim Verification Module -->
    <g transform="translate(20, 234)">
      <rect width="720" height="114" rx="10" fill="#0b171c" stroke="#0e7490" stroke-width="1"/>
      <text x="16" y="24" fill="#22d3ee" font-size="12" font-weight="700">3. External Verification Module (Claim-Gated)</text>
      
      <!-- 3 Columns inside claim module -->
      <g transform="translate(16, 36)">
        <rect width="218" height="64" rx="6" fill="#08222c"/>
        <text x="14" y="22" fill="#67e8f9" font-size="11" font-weight="600">Pre-Registration</text>
        <text x="14" y="38" fill="#94a3b8" font-size="10">Link before search</text>
        <text x="14" y="52" fill="#22d3ee" font-size="10" font-family="monospace">--supports &lt;hyp-id&gt;</text>
      </g>

      <g transform="translate(250, 36)">
        <rect width="218" height="64" rx="6" fill="#08222c"/>
        <text x="14" y="22" fill="#67e8f9" font-size="11" font-weight="600">Dual-Source Corroboration</text>
        <text x="14" y="38" fill="#94a3b8" font-size="10">≥ 2 Root Domains</text>
        <text x="14" y="52" fill="#38bdf8" font-size="10">Tier 1/2 Primary &amp; Direct Docs</text>
      </g>

      <g transform="translate(484, 36)">
        <rect width="220" height="64" rx="6" fill="#08222c"/>
        <text x="14" y="22" fill="#67e8f9" font-size="11" font-weight="600">Counter-Evidence Search</text>
        <text x="14" y="38" fill="#94a3b8" font-size="10">Mandatory negative probe</text>
        <text x="14" y="52" fill="#a5f3fc" font-size="10" font-family="monospace">--claimQuote + --negativeFinding</text>
      </g>
    </g>

    <!-- Sub-Block 4: Terminal Gates 6-11 Engine -->
    <g transform="translate(20, 360)">
      <rect width="720" height="94" rx="10" fill="#1e131d" stroke="#be185d" stroke-width="1.2"/>
      
      <text x="16" y="24" fill="#f472b6" font-size="12" font-weight="700">4. Terminal Enforcement: Gates 6–11</text>
      <text x="490" y="24" fill="#fda4af" font-size="11">Enforced by <tspan font-family="monospace">scripts/think.ts</tspan></text>

      <g transform="translate(16, 36)">
        <!-- Gate badges -->
        <rect x="0" y="0" width="130" height="42" rx="6" fill="#2b1022"/>
        <text x="10" y="18" fill="#fbcfe8" font-size="10" font-weight="700">Gate 6: Criteria</text>
        <text x="10" y="33" fill="#f472b6" font-size="9">≥1 added &amp; checked</text>

        <rect x="140" y="0" width="130" height="42" rx="6" fill="#2b1022"/>
        <text x="10" y="18" fill="#fbcfe8" font-size="10" font-weight="700">Gate 8: Lenses</text>
        <text x="10" y="33" fill="#f472b6" font-size="9">≥2 distinct lenses</text>

        <rect x="280" y="0" width="140" height="42" rx="6" fill="#2b1022"/>
        <text x="10" y="18" fill="#fbcfe8" font-size="10" font-weight="700">Gate 9: Convergence</text>
        <text x="10" y="33" fill="#f472b6" font-size="9">newInsight=false</text>

        <rect x="430" y="0" width="124" height="42" rx="6" fill="#2b1022"/>
        <text x="10" y="18" fill="#fbcfe8" font-size="10" font-weight="700">Gate 10: Falsify</text>
        <text x="10" y="33" fill="#f472b6" font-size="9">Outcomes audited</text>

        <!-- Guard exit result -->
        <rect x="564" y="0" width="124" height="42" rx="6" fill="#4c0519" stroke="#e11d48"/>
        <text x="12" y="18" fill="#fecdd3" font-size="10" font-weight="700">Broken Gate?</text>
        <text x="12" y="33" fill="#f43f5e" font-size="10" font-weight="700">► Exit Code 1</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM TERMINAL / REASONING TRACE CARD ================= -->
  <g transform="translate(30, 678)">
    <rect width="1140" height="236" rx="14" fill="#070a12" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Terminal Titlebar -->
    <rect width="1140" height="34" rx="14" fill="#0f172a"/>
    <circle cx="24" cy="17" r="5" fill="#ef4444"/>
    <circle cx="40" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="17" r="5" fill="#10b981"/>
    <text x="80" y="22" fill="#94a3b8" font-size="11" font-family="monospace">SESSION TRACE &amp; LINT AUDIT SHEET · scripts/.think_state.json</text>
    <text x="960" y="22" fill="#38bdf8" font-size="11" font-family="monospace">AUTOPRINT ON TERMINATION</text>

    <!-- Terminal Content (Two Columns of Real Session Evidence) -->
    <g transform="translate(24, 46)" font-family="monospace" font-size="11">
      <!-- Col 1: Real Session Timeline -->
      <text y="16" fill="#64748b">[08:00:01] <tspan fill="#38bdf8">INIT</tspan>       mode=path-b kind=decision startedAt=2026-10-09 state=v3</text>
      <text y="36" fill="#64748b">[08:00:02] <tspan fill="#a855f7">HYPO</tspan>       hyp-1: "Direct API agility" falsification="managed egress &lt; $100"</text>
      <text y="56" fill="#64748b">[08:00:02] <tspan fill="#a855f7">HYPO</tspan>       hyp-2: "Managed governance"  falsification="SOC2 passes without audit"</text>
      <text y="76" fill="#64748b">[08:00:03] <tspan fill="#c084fc">ANALYZE</tspan>    --analyze sensitivity --data '&lt;json&gt;' → computed lens persisted</text>
      <text y="96" fill="#64748b">[08:00:04] <tspan fill="#06b6d4">CLAIM</tspan>      claim-1: verified · 2x Tier 1 (aws.amazon.com, anthropic.com) freshness=42d</text>
      <text y="116" fill="#64748b">[08:00:05] <tspan fill="#10b981">RESOLVE</tspan>    hyp-1: selected (survived: latency confirmed) flipIf="latency equalized"</text>
      <text y="136" fill="#64748b">[08:00:05] <tspan fill="#ef4444">RESOLVE</tspan>    hyp-2: rejected (survived: controls achievable but unneeded)</text>
      <text y="156" fill="#64748b">[08:00:06] <tspan fill="#f59e0b">SYNTH</tspan>      newInsight=false ("first synthesis round surfaced no new insight")</text>

      <!-- Col 2: Fact Sheet Matrix (Divider Line + Status) -->
      <line x1="680" y1="0" x2="680" y2="166" stroke="#1e293b" stroke-width="1.2"/>
      
      <g transform="translate(710, 0)">
        <text y="16" fill="#f8fafc" font-weight="700">## Reasoning Trace Verification Report</text>
        <text y="36" fill="#10b981">✓ Gate 6 (Acceptance Criteria):  1/1 Checked &amp; Met</text>
        <text y="56" fill="#10b981">✓ Gate 8 (Critical Lenses):      2 Lenses recorded (First-Principles, Pareto)</text>
        <text y="76" fill="#10b981">✓ Gate 9 (Convergence Guard):    newInsight=false with valid notes</text>
        <text y="96" fill="#10b981">✓ Gate 10 (Falsification Audit): Audited (1 selected, 1 rejected)</text>
        <text y="116" fill="#10b981">✓ Gate 11 (Mainline Branch):     Clean mainline convergence</text>
        <text y="136" fill="#38bdf8">Residual Issues: 0 CRIT · 0 WARN · 0 INFO Escape</text>
        <text y="156" fill="#34d399" font-weight="700">STATUS: CONVERGED · FACT SHEET EMITTED</text>
      </g>
    </g>
  </g>
</svg>
